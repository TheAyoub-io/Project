<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Réinitialiser le mot de passe — e-Internat</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="auth-centered">
    <div class="auth-blob-1" style="top:20%;right:20%;"></div>
    <div class="auth-blob-2" style="bottom:20%;left:20%;"></div>

    <div class="auth-form-container glass-card" style="width: 100%;">
      <div class="auth-header">
        <a href="index.html">
          <img src="assets/official_logo.png" alt="Logo" />
        </a>
        <h2>Réinitialiser le mot de passe</h2>
        <p>Entrez le code reçu par email et votre nouveau mot de passe.</p>
      </div>

      <div id="alert-container"></div>

      <form id="reset-form" class="auth-form">
        <div class="auth-input-group">
          <label class="form-label" for="token">Code de réinitialisation</label>
          <div style="position:relative;">
            <span class="form-icon">🔑</span>
            <input type="text" id="token" class="form-input form-input-with-icon" placeholder="123456" required autocomplete="off" />
          </div>
        </div>

        <div class="auth-input-group">
          <label class="form-label" for="password">Nouveau mot de passe</label>
          <div style="position:relative;">
            <span class="form-icon">🔒</span>
            <input type="password" id="password" class="form-input form-input-with-icon" placeholder="••••••••" required autocomplete="new-password" />
          </div>
        </div>

        <div class="auth-input-group">
          <label class="form-label" for="confirm-password">Confirmer le mot de passe</label>
          <div style="position:relative;">
            <span class="form-icon">🔒</span>
            <input type="password" id="confirm-password" class="form-input form-input-with-icon" placeholder="••••••••" required autocomplete="new-password" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%;margin-top:0.5rem;">
          Réinitialiser
        </button>
      </form>

      <div class="auth-footer" style="margin-top:2rem;">
        <a href="login.html">← Retour à la connexion</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      auth.redirectIfLoggedIn();

      const form = document.getElementById('reset-form');
      const btn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = document.getElementById('token').value;
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm-password').value;
        const alertContainer = document.getElementById('alert-container');

        alertContainer.innerHTML = '';

        if (password !== confirm) {
          alertContainer.innerHTML = `<div class="alert alert-danger" style="margin-bottom:1.5rem">Les mots de passe ne correspondent pas.</div>`;
          return;
        }

        const originalText = btn.innerHTML;
        btn.innerHTML = '<div class="spinner" style="width:1.25rem;height:1.25rem;border-width:2px;border-top-color:#fff;"></div>';
        btn.disabled = true;

        try {
          const response = await auth.resetPassword(token, password);
          alertContainer.innerHTML = `<div class="alert alert-success" style="margin-bottom:1.5rem">${response.message || 'Mot de passe réinitialisé.'}</div>`;
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } catch (err) {
          btn.innerHTML = originalText;
          btn.disabled = false;
          let detail = err.data?.detail || 'Une erreur est survenue.';
          if (Array.isArray(detail)) detail = detail[0].msg;
          alertContainer.innerHTML = `<div class="alert alert-danger" style="margin-bottom:1.5rem">${detail}</div>`;
        }
      });
    });
  </script>
</body>
</html>
