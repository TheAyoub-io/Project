<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mot de passe oublié — e-Internat</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="auth-centered">
    <!-- Decorative background blobs -->
    <div class="auth-blob-1" style="top:20%;right:20%;"></div>
    <div class="auth-blob-2" style="bottom:20%;left:20%;"></div>

    <div class="auth-form-container glass-card" style="width: 100%;">
      <div class="auth-header">
        <a href="index.html">
          <img src="assets/official_logo.png" alt="Logo" />
        </a>
        <h2>Mot de passe oublié</h2>
        <p>Entrez votre email pour recevoir un code de réinitialisation.</p>
      </div>

      <div id="alert-container"></div>

      <form id="forgot-form" class="auth-form">
        <div class="auth-input-group">
          <label class="form-label" for="email">Adresse email</label>
          <div style="position:relative;">
            <span class="form-icon">✉</span>
            <input type="email" id="email" class="form-input form-input-with-icon" placeholder="votre@email.com" required autocomplete="email" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%;margin-top:0.5rem;">
          Envoyer le code
        </button>
      </form>

      <div class="auth-footer" style="margin-top:2rem;">
        <a href="login.html">← Retour à la connexion</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      auth.redirectIfLoggedIn();

      const form = document.getElementById('forgot-form');
      const btn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const alertContainer = document.getElementById('alert-container');

        alertContainer.innerHTML = '';
        const originalText = btn.innerHTML;
        btn.innerHTML = '<div class="spinner" style="width:1.25rem;height:1.25rem;border-width:2px;border-top-color:#fff;"></div>';
        btn.disabled = true;

        try {
          const response = await auth.forgotPassword(email);
          alertContainer.innerHTML = `<div class="alert alert-success" style="margin-bottom:1.5rem">${response.message || 'Code envoyé avec succès.'}</div>`;
          setTimeout(() => {
            window.location.href = 'reset-password.html';
          }, 2000);
        } catch (err) {
          btn.innerHTML = originalText;
          btn.disabled = false;
          let detail = err.data?.detail || 'Une erreur est survenue.';
          if (Array.isArray(detail)) detail = detail[0].msg;
          alertContainer.innerHTML = `<div class="alert alert-danger" style="margin-bottom:1.5rem">${detail}</div>`;
        }
      });
    });
  </script>
</body>
</html>
