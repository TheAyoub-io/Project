<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Introuvable — e-Internat</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <style>
    .not-found-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    .not-found-bg {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 40vw;
      font-weight: 900;
      color: rgba(16,185,129,0.03);
      pointer-events: none;
      z-index: 0;
      line-height: 1;
    }
    [data-theme="dark"] .not-found-bg {
      color: rgba(16,185,129,0.05);
    }
    .not-found-content {
      position: relative;
      z-index: 10;
      max-width: 500px;
      animation: slideUp 0.6s var(--ease-out-expo) forwards;
    }
    .not-found-content h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .not-found-content p {
      font-size: 1.125rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <a href="index.html" class="navbar-brand">
      <img src="assets/official_logo.png" alt="Logo" />
      <span>e‑<span class="text-gradient-green">Internat</span></span>
    </a>
    <div class="navbar-actions">
      <button class="theme-toggle" id="theme-toggle" type="button" onclick="theme.toggle()">🌙</button>
    </div>
  </nav>

  <div class="not-found-wrapper">
    <div class="not-found-bg">404</div>
    
    <div class="not-found-content glass-card">
      <div style="font-size: 4rem; margin-bottom: 1rem;">🧭</div>
      <h1>Oups ! Page introuvable</h1>
      <p>Il semble que vous vous soyez égaré. La page que vous recherchez n'existe pas ou a été déplacée.</p>
      
      <div class="flex justify-center gap-4">
        <button onclick="window.history.back()" class="btn btn-outline">← Retour</button>
        <a href="index.html" class="btn btn-primary">Aller à l'accueil</a>
      </div>
    </div>
  </div>

  <script src="js/theme.js"></script>
</body>
</html>
